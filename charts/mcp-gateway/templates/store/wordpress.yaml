{{- if .Values.store.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.store.wp.storageClass }}
  storageClassName: {{ .Values.store.wp.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.store.wp.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: wordpress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: {{ .Release.Namespace }}
  labels:
    app: wordpress
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - name: wordpress
          image: wordpress:6.6-apache
          imagePullPolicy: IfNotPresent
          env:
            - name: WORDPRESS_DB_HOST
              value: "mariadb:3306"
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MARIADB_DATABASE
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MARIADB_USER
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MARIADB_PASSWORD
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('FS_METHOD', 'direct');
                define('WP_HOME', 'http://{{ .Values.store.hostname }}');
                define('WP_SITEURL', 'http://{{ .Values.store.hostname }}');
                define('WP_ENVIRONMENT_TYPE', 'local');
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: {{ .Values.store.wp.resources.requests.cpu }}
              memory: {{ .Values.store.wp.resources.requests.memory }}
            limits:
              cpu: {{ .Values.store.wp.resources.limits.cpu }}
              memory: {{ .Values.store.wp.resources.limits.memory }}
          livenessProbe:
            httpGet:
              path: /wp-login.php
              port: 80
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: wp-data
              mountPath: /var/www/html
      volumes:
        - name: wp-data
          persistentVolumeClaim:
            claimName: wordpress-pvc
{{- end }}
